<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919;            /* Notion dark background */
    --text: #e8e8e8;
    --muted: #8d8d8d;
    --red: #ff3355;
    --blue: #2f7bff;
    --s: clamp(54px, min(17vw, 38vh), 170px);   /* tile size: scales with the widget */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  .app { position: relative; width: 100%; height: 100%; min-height: 220px; display: grid; place-items: center; overflow: hidden; }

  /* soft blue / red light, only strong in full screen */
  .glow { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 1s ease; }
  .g1 { left: 8%;  top: -20%;    width: 55vmax; height: 40vmax; background: radial-gradient(closest-side, rgba(47,123,255,.30), rgba(47,123,255,0)); animation: drift1 18s ease-in-out infinite; }
  .g2 { right: 6%; bottom: -24%; width: 55vmax; height: 40vmax; background: radial-gradient(closest-side, rgba(255,51,85,.26), rgba(255,51,85,0)); animation: drift2 21s ease-in-out infinite; }
  .app.full .glow { opacity: 1; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4vw,3vh); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-4vw,-3vh); } }

  /* ---------- clock ---------- */
  .view { position: relative; z-index: 1; text-align: center; padding: 0 12px; max-width: 100%; }
  .heading {
    margin: 0 0 calc(var(--s) * .16);
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: calc(var(--s) * .27);
    letter-spacing: .12em;
    text-transform: uppercase;
    line-height: 1.1;
    background: linear-gradient(90deg, #4d9bff 0%, #4d9bff 42%, #ff3b55 58%, #ff3b55 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    overflow-wrap: anywhere;
  }
  .tiles { display: flex; justify-content: center; gap: calc(var(--s) * .13); }

  .tile {
    --a: #9fd2ff; --b: #2f7bff;
    position: relative; isolation: isolate;
    flex: none;
    width: calc(var(--s) * 1.0);
    padding: calc(var(--s) * .14) 0 calc(var(--s) * .12);
    border-radius: calc(var(--s) * .16);
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--b) 26%, transparent), transparent 62%),
      rgba(24,24,28,.86);
    box-shadow: inset 0 0 calc(var(--s) * .3) rgba(0,0,0,.30);
    text-align: center;
  }
  .tile::after {                       /* thin blue-to-red edge, no white */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--b) 85%, transparent), color-mix(in srgb, var(--b) 16%, transparent) 55%, color-mix(in srgb, var(--b) 40%, transparent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }
  .t1 { --a: #8fd0ff; --b: #1f7bff; }   /* bright blue   */
  .t2 { --a: #7fa6ff; --b: #2b4dff; }   /* electric blue */
  .t3 { --a: #ff9a7a; --b: #ff3b30; }   /* red-orange    */
  .t4 { --a: #ff7585; --b: #ff1744; }   /* hot red       */

  .tile b {
    display: block;
    font-family: "Orbitron", "Rajdhani", sans-serif;
    font-weight: 900;
    font-size: calc(var(--s) * .44);
    line-height: 1.05;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--a), var(--b));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    white-space: nowrap;
    filter: drop-shadow(0 0 calc(var(--s) * .10) color-mix(in srgb, var(--b) 80%, transparent));
  }
  .tile b.d3 { font-size: calc(var(--s) * .33); }
  .tile b.d4 { font-size: calc(var(--s) * .25); }
  .tile b.tick { animation: tick .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes tick { 0% { transform: translateY(-14%) scale(.94); opacity: .3; } 100% { transform: none; opacity: 1; } }
  .tile span {
    display: block;
    margin-top: calc(var(--s) * .04);
    font-size: max(10px, calc(var(--s) * .12));
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .t4.pulse { animation: pulse 1s ease-out; }
  @keyframes pulse { 0% { box-shadow: inset 0 0 calc(var(--s) * .3) rgba(0,0,0,.30), 0 0 0 rgba(255,51,85,0); } 25% { box-shadow: inset 0 0 calc(var(--s) * .3) rgba(0,0,0,.30), 0 0 calc(var(--s) * .26) rgba(255,51,85,.38); } 100% { box-shadow: inset 0 0 calc(var(--s) * .3) rgba(0,0,0,.30), 0 0 0 rgba(255,51,85,0); } }

  .tag {
    margin: calc(var(--s) * .2) 0 0;
    font-size: calc(var(--s) * .2);
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .app.done .tag { color: #ff6b86; }

  /* ---------- corner buttons ---------- */
  .icon-btn {
    position: absolute; bottom: 12px; z-index: 5;
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid #2f2f2f;
    background: #202020;
    color: #a8a8a8;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, opacity .4s ease, transform .15s ease;
  }
  .icon-btn:hover { color: #fff; border-color: #4a6fd6; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .icon-btn svg { width: 17px; height: 17px; }
  .pos-left  { left: 12px; }
  .pos-right { right: 12px; }

  /* ---------- full screen ---------- */
  .app.full { --s: clamp(72px, min(17vw, 36vh), 300px); }
  .app.full #gearBtn { display: none; }
  .app.full.idle .icon-btn { opacity: 0; }
  .app.full.idle { cursor: none; }

  /* ---------- settings panel ---------- */
  .panel {
    position: absolute; inset: 0; z-index: 10;
    overflow-y: auto;
    padding: 16px 18px 18px;
    background: var(--bg);
  }
  .panel-inner { max-width: 560px; margin: 0 auto; }
  .panel h2 { margin: 0 0 12px; font-size: 20px; font-weight: 700; letter-spacing: .04em; color: var(--text); }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: #7d7d7d; }
  .field input {
    width: 100%; padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2f2f2f;
    background: #202020;
    color: var(--text);
    font: inherit; font-size: 16px;
    color-scheme: dark;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus { border-color: #4a6fd6; box-shadow: 0 0 0 3px rgba(47,123,255,.18); }
  .done-btn {
    width: 100%; margin-top: 4px; padding: 12px 18px;
    border: 0; border-radius: 12px;
    font: inherit; font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--red));
    box-shadow: 0 6px 22px rgba(47,123,255,.28);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .done-btn:hover { transform: translateY(-1px); box-shadow: 0 9px 28px rgba(255,51,85,.30); }
  .done-btn:active { transform: scale(.99); }
  .hint { margin: 8px 0 0; font-size: 13px; color: #6f6f6f; text-align: center; }

  .toast {
    position: absolute; left: 50%; bottom: 58px; z-index: 20;
    max-width: 86%; padding: 9px 14px;
    transform: translate(-50%, 8px);
    border-radius: 10px;
    background: #262628; border: 1px solid #3a3a3e;
    font-size: 14px; color: var(--text); text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <div class="glow g1"></div><div class="glow g2"></div>

  <section class="view" id="view">
    <h1 class="heading" id="heading">COUNTDOWN</h1>
    <div class="tiles" role="timer" aria-label="Time remaining">
      <div class="tile t1"><b id="vD">00</b><span>Days</span></div>
      <div class="tile t2"><b id="vH">00</b><span>Hours</span></div>
      <div class="tile t3"><b id="vM">00</b><span>Mins</span></div>
      <div class="tile t4" id="tileS"><b id="vS">00</b><span>Secs</span></div>
    </div>
    <p class="tag" id="tag">left</p>
  </section>

  <button class="icon-btn" id="gearBtn" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="icon-btn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen">
    <svg id="icoExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    <svg id="icoShrink" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
  </button>

  <section class="panel hidden" id="panel" aria-label="Countdown settings">
    <div class="panel-inner">
      <h2>Countdown Settings</h2>
      <div class="field"><label for="inTitle">Heading Title</label><input id="inTitle" type="text" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="inTag">Bottom Label / Tag</label><input id="inTag" type="text" maxlength="30" autocomplete="off"></div>
      <div class="field"><label for="inTarget">Target Date &amp; Time</label><input id="inTarget" type="datetime-local"></div>
      <button class="done-btn" id="doneBtn" type="button">Done</button>
      <p class="hint">Saved on this device automatically.</p>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</main>

<script>
(function () {
  "use strict";

  /* ============ settings you may want to change ============ */
  var STORAGE_KEY = "wod-countdown-v1";
  var SETTINGS_SIDE = "left";      // which bottom corner holds the settings button: "left" or "right"
  var FULLSCREEN_SIDE = "right";   // which bottom corner holds the full screen button
  var DEFAULTS = { title: "COUNTDOWN", tag: "left", target: "2026-12-31T18:30" };
  var DONE_TEXT = "Time's up!";
  /* ========================================================= */

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), headingEl = $("heading"), tagEl = $("tag");
  var vD = $("vD"), vH = $("vH"), vM = $("vM"), vS = $("vS"), tileS = $("tileS");
  var gearBtn = $("gearBtn"), fsBtn = $("fsBtn"), panel = $("panel"), toast = $("toast");
  var inTitle = $("inTitle"), inTag = $("inTag"), inTarget = $("inTarget");

  gearBtn.classList.add(SETTINGS_SIDE === "right" ? "pos-right" : "pos-left");
  fsBtn.classList.add(FULLSCREEN_SIDE === "left" ? "pos-left" : "pos-right");

  /* ---------- saved settings (safe if the browser blocks storage) ---------- */
  var memory = null;
  function load() {
    var s = { title: DEFAULTS.title, tag: DEFAULTS.tag, target: DEFAULTS.target };
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === "object") {
          if (typeof o.title === "string") s.title = o.title.slice(0, 40);
          if (typeof o.tag === "string") s.tag = o.tag.slice(0, 30);
          if (typeof o.target === "string" && !isNaN(new Date(o.target).getTime())) s.target = o.target;
        }
      }
    } catch (e) { if (memory) return memory; }
    return s;
  }
  function save() {
    memory = settings;
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
  }
  var settings = load();

  /* ---------- clock ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function setVal(el, v) {
    if (el.textContent !== v) {
      el.textContent = v;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      return true;
    }
    return false;
  }
  function targetMs() { var t = new Date(settings.target).getTime(); return isNaN(t) ? Date.now() : t; }

  function tick() {
    var diff = targetMs() - Date.now();
    var done = diff <= 0;
    if (done) diff = 0;
    var secs = Math.floor(diff / 1000);
    var d = Math.floor(secs / 86400);
    var h = Math.floor((secs % 86400) / 3600);
    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    var dStr = pad(d);
    vD.classList.toggle("d3", dStr.length === 3);
    vD.classList.toggle("d4", dStr.length >= 4);
    setVal(vD, dStr); setVal(vH, pad(h)); setVal(vM, pad(m));
    if (setVal(vS, pad(s)) && !done) {
      tileS.classList.remove("pulse"); void tileS.offsetWidth; tileS.classList.add("pulse");
    }
    app.classList.toggle("done", done);
    tagEl.textContent = done ? DONE_TEXT : settings.tag;
    tagEl.classList.toggle("hidden", !done && !settings.tag);
  }

  function renderText() {
    headingEl.textContent = settings.title;
    headingEl.classList.toggle("hidden", !settings.title);
    tick();
  }

  /* ---------- settings panel ---------- */
  function openPanel() {
    inTitle.value = settings.title;
    inTag.value = settings.tag;
    inTarget.value = settings.target;
    panel.classList.remove("hidden");
    inTitle.focus();
  }
  function closePanel() {
    panel.classList.add("hidden");
    gearBtn.focus();
  }
  inTitle.addEventListener("input", function () { settings.title = inTitle.value.slice(0, 40); save(); renderText(); });
  inTag.addEventListener("input",   function () { settings.tag = inTag.value.slice(0, 30); save(); renderText(); });
  inTarget.addEventListener("input", function () {
    if (inTarget.value && !isNaN(new Date(inTarget.value).getTime())) { settings.target = inTarget.value; save(); tick(); }
  });
  gearBtn.addEventListener("click", openPanel);
  $("doneBtn").addEventListener("click", closePanel);

  /* ---------- full screen ---------- */
  var nativeFull = false, softFull = false, idleTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 5200);
  }
  function setFullUI(on) {
    app.classList.toggle("full", on);
    $("icoExpand").classList.toggle("hidden", on);
    $("icoShrink").classList.toggle("hidden", !on);
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    fsBtn.title = on ? "Exit full screen" : "Full screen";
    wake();
  }
  function wake() {
    app.classList.remove("idle");
    clearTimeout(idleTimer);
    if (app.classList.contains("full")) idleTimer = setTimeout(function () { app.classList.add("idle"); }, 2600);
  }
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }

  function enterFull() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    softFull = true;                       // always fill the widget; the browser may also go full screen
    setFullUI(true);
    if (!req) { showToast("Full screen fills this widget. Open the widget link in its own tab for true full screen."); return; }
    try {
      var r = req.call(el);
      nativeFull = true;
      if (r && r.catch) r.catch(function () {
        nativeFull = false;
        showToast("Your browser blocked full screen inside Notion, so it fills the widget instead. Open the widget link in its own tab for true full screen.");
      });
    } catch (e) {
      nativeFull = false;
      showToast("Your browser blocked full screen inside Notion, so it fills the widget instead. Open the widget link in its own tab for true full screen.");
    }
  }
  function exitFull() {
    softFull = false;
    if (fsElement()) {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      try { var r = ex.call(document); if (r && r.catch) r.catch(function () {}); } catch (e) {}
    }
    nativeFull = false;
    setFullUI(false);
  }
  function onFsChange() {
    if (nativeFull && !fsElement()) { softFull = false; nativeFull = false; setFullUI(false); }   // player pressed Esc
  }
  fsBtn.addEventListener("click", function () { if (app.classList.contains("full")) exitFull(); else enterFull(); });
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  ["mousemove", "pointerdown", "keydown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!panel.classList.contains("hidden")) closePanel();
    else if (app.classList.contains("full")) exitFull();
  });

  /* ---------- go ---------- */
  renderText();
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") tick(); });
})();
</script>
</body>
</html>
